name: CI/CD Pipeline - Production Readiness

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./backend/package-lock.json

    - name: Verify package-lock.json integrity
      run: |
        npm ci --dry-run
        git diff --exit-code package-lock.json || (echo "Error: package-lock.json is out of sync!" && exit 1)

    - name: Install Dependencies
      run: npm ci

    - name: Run Audit (Security Scan)
      run: npm audit --audit-level=critical

    - name: Initialize Database & Run Migrations
      run: node -e "require('./db').initDb().then(() => process.exit(0)).catch(() => process.exit(1))"

    - name: Run Tests
      run: npm test

    - name: Run Hardening and Route isolation Tests
      run: |
        node tests/hardening.test.js
        node tests/authRegression.test.js

    - name: Verify Security Headers in Server
      run: |
        node tests/securityHeaders.test.js

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json

    - name: Verify package-lock.json integrity
      run: |
        npm ci --dry-run
        git diff --exit-code package-lock.json || (echo "Error: package-lock.json is out of sync!" && exit 1)

    - name: Install Dependencies
      run: npm ci

    - name: Run Lint
      run: npm run lint || true

    - name: Build Application
      run: npm run build
